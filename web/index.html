<!DOCTYPE html>
<html lang="zh-CN" data-theme="glass">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="mask-icon" href="/logo.svg" color="#5B6CFF" />
  <title>智泊 · 小区停车管理系统</title>
  <script>
    // 在样式加载前就设定主题，避免刷新时先闪一下默认配色
    (function () {
      try {
        var dark = ['douyin', 'mars', 'moon', 'earth']
        var t = localStorage.getItem('app-theme') || 'glass'
        document.documentElement.setAttribute('data-theme', t)
        document.documentElement.style.colorScheme = dark.indexOf(t) > -1 ? 'dark' : 'light'
      } catch (e) { /* 隐私模式下 localStorage 不可用，忽略 */ }
    })()
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
